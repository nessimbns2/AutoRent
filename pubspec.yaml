name: autorent
description: "AutoRent — Gestion de location de voitures (offline, ESPRIT mobile course project)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  crypto: ^3.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.17
  shared_preferences_android: 2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
