name: autorent
description: "AutoRent — Gestion de location de voitures (100% hors-ligne, SQLite, projet mobile ESPRIT)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  crypto: ^3.0.5
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  http: ^1.6.0
  mailer: ^7.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  path_provider_android: 2.2.17
  shared_preferences_android: 2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/vehicles/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FF6B2C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0E1726"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0E1726"
    image: assets/icon/splash_logo.png
  ios: true
  android: true
  web: false
